version: '3.8'

# ══════════════════════════════════════════════════════════════════════
#  OCI Always-Free Micro VM Supporting Services
#  Components:
#   1. Redis (In-memory cache with memory caps for 1GB RAM machine)
#   2. Uptime Kuma (24/7 health monitoring & prevents OCI idle shutdown)
# ══════════════════════════════════════════════════════════════════════

services:
  # ─── Redis Caching Layer ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oci-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme_secure_redis_password}
      --maxmemory 200mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_secure_redis_password}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Uptime Monitoring & Heartbeat ────────────────────────────────
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: oci-uptime-kuma
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  redis_data:
  uptime_kuma_data:
