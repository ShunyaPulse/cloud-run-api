# ══════════════════════════════════════════════════════════════════════
#  CI/CD Pipeline — Build, Push to GHCR & Deploy to Google Cloud Run
# ══════════════════════════════════════════════════════════════════════

name: Build & Deploy to Cloud Run

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Image name = ghcr.io/<owner>/<repo> (auto-derived from repository)
  IMAGE_NAME: ${{ github.repository }}
  SERVICE_NAME: cloud-run-app
  REGION: asia-south1

jobs:
  build-and-deploy:
    name: Build, Push & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ─────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Authenticate to GHCR ─────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Extract metadata (tags, labels) ──────────────────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=long

      # ── 4. Build & Push image ───────────────────────────────────────────
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline

      # ── 5. Authenticate to Google Cloud ──────────────────────────────────
      # Requires GCP_CREDENTIALS secret in GitHub (Service Account JSON)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # ── 6. Deploy to Cloud Run ───────────────────────────────────────────
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          flags: |
            --platform=managed
            --allow-unauthenticated
            --min-instances=0
            --max-instances=2
            --port=8080
            --memory=256Mi
            --cpu=1
          env_vars: |
            NODE_ENV=production
          secrets: |
            DATABASE_URL=DATABASE_URL:latest

      # ── 7. Print Output ──────────────────────────────────────────────────
      - name: Show Output
        run: echo "Deployed Service URL -> ${{ steps.deploy.outputs.url }}"
